name: Interest Rate Scraper

on:
  schedule:
    # Run every 3 hours on weekdays, before 19:00 TRT (16:00 UTC)
    # Runs at: 03:00, 06:00, 09:00, 12:00, 15:00, 18:00 TRT
    - cron: '0 0-15/3 * * 1-5'
    # Run at 13:15 TRT (10:15 UTC) on weekdays
    - cron: '15 10 * * 1-5'
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      working-directory: ./scraper
      run: npm install

    - name: Run Scraper
      working-directory: ./scraper
      env:
        GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
        GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      run: npm start


